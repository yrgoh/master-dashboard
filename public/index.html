<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.5em; font-weight: 600; color: #f0f6fc; }
    header .subtitle { font-size: 0.85em; color: #8b949e; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 24px 32px 32px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #58a6ff; }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .icon { font-size: 1.5em; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      background: #21262d; border-radius: 8px; }
    .card-title { font-size: 1.05em; font-weight: 600; color: #f0f6fc; }
    .card-desc { font-size: 0.82em; color: #8b949e; margin-bottom: 12px; line-height: 1.4; }
    .tech-stack { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
    .tech-tag { font-size: 0.7em; padding: 2px 8px; background: #21262d; color: #8b949e;
      border-radius: 12px; border: 1px solid #30363d; }
    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.stopped { background: #484f58; }
    .status-dot.starting { background: #d29922; animation: pulse 1s ease-in-out infinite; }
    .status-dot.running { background: #3fb950; }
    .status-dot.error { background: #f85149; }
    .status-text { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-text.stopped { color: #484f58; }
    .status-text.starting { color: #d29922; }
    .status-text.running { color: #3fb950; }
    .status-text.error { color: #f85149; }
    .urls { margin-bottom: 16px; }
    .url-link { display: block; font-size: 0.78em; color: #8b949e; text-decoration: none; margin-top: 2px; }
    .url-link:hover { text-decoration: underline; }
    .url-link.live { color: #58a6ff; }
    .actions { display: flex; gap: 8px; }
    button {
      padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d; cursor: pointer;
      font-size: 0.8em; font-weight: 500; background: #21262d; color: #c9d1d9;
      transition: all 0.15s;
    }
    button:hover { background: #30363d; border-color: #58a6ff; }
    button.launch { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.launch:hover { background: #388bfd; }
    button.stop { background: #da3633; border-color: #da3633; color: #fff; }
    button.stop:hover { background: #f85149; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .footer { text-align: center; padding: 16px; font-size: 0.72em; color: #484f58; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Master Dashboard</h1>
      <p class="subtitle">Project launcher — start and stop development servers</p>
    </div>
  </header>
  <div class="grid" id="app-grid"></div>
  <div class="footer">Status updates every 3 seconds</div>

  <script>
    const iconMap = {
      map: '🗺️', chart: '📊', road: '🛣️', brain: '🧠', users: '👥',
    };

    function renderApps(apps) {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = apps.map(app => `
        <div class="card" id="card-${app.id}">
          <div class="card-header">
            <div class="icon">${iconMap[app.icon] || '📦'}</div>
            <div>
              <div class="card-title">${app.name}</div>
            </div>
          </div>
          <div class="card-desc">${app.description}</div>
          <div class="tech-stack">${(app.techStack || []).map(t => `<span class="tech-tag">${t}</span>`).join('')}</div>
          <div class="status-row">
            <span class="status-dot ${app.status}"></span>
            <span class="status-text ${app.status}">${app.status}</span>
          </div>
          <div class="urls">
            ${app.frontendUrl ? `<a class="url-link ${app.status === 'running' ? 'live' : ''}" href="${app.frontendUrl}" target="_blank">${app.frontendUrl}</a>` : ''}
            ${app.backendUrl ? `<a class="url-link ${app.status === 'running' ? 'live' : ''}" href="${app.backendUrl}/api/health" target="_blank">${app.backendUrl} (API)</a>` : ''}
          </div>
          <div class="actions">
            <button class="launch" onclick="startApp('${app.id}')" ${app.status === 'running' || app.status === 'starting' ? 'disabled' : ''}>Launch</button>
            <button class="stop" onclick="stopApp('${app.id}')" ${app.status === 'stopped' ? 'disabled' : ''}>Stop</button>
          </div>
        </div>
      `).join('');
    }

    async function fetchApps() {
      try {
        const res = await fetch('/api/apps');
        const apps = await res.json();
        renderApps(apps);
      } catch (err) {
        console.error('Failed to fetch apps:', err);
      }
    }

    async function startApp(id) {
      try {
        const btn = document.querySelector(`#card-${id} .launch`);
        if (btn) btn.disabled = true;
        await fetch(`/api/apps/${id}/start`, { method: 'POST' });
        fetchApps();
      } catch (err) {
        console.error('Failed to start app:', err);
        fetchApps();
      }
    }

    async function stopApp(id) {
      try {
        const btn = document.querySelector(`#card-${id} .stop`);
        if (btn) btn.disabled = true;
        await fetch(`/api/apps/${id}/stop`, { method: 'POST' });
        fetchApps();
      } catch (err) {
        console.error('Failed to stop app:', err);
        fetchApps();
      }
    }

    fetchApps();
    setInterval(fetchApps, 3000);
  </script>
</body>
</html>
